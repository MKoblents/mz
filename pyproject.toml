[project]
name = "csa-lab4"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pyyaml", "types-PyYAML", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["isa.py", "machine.py", "translation", "components", "memory", "microcode", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # docstrings are not required by the task; names and tables document the code
    "T201",     # print is the output channel of the console tools
    "COM812",   # conflicts with the formatter
    "ISC001",   # conflicts with the formatter
    "FBT001",   # boolean parameters model one-bit hardware signals (mem_rd, mem_wr, ...)
    "FBT002",   # same
    "PLR2004",  # numeric constants of the ISA and of the hardware tables are intentional
    "PLR0911",  # ALU and multiplexers are flat dispatches by a signal code
    "PLR0912",  # same
    "C901",     # same
    "EM101",    # short error messages are enough for this project
    "EM102",    # same
    "TRY003",   # same
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "INP001"]

